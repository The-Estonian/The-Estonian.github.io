<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Lists Toggle</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        text-align: center;
        background: #121212;
        color: white;
        max-width: 600px;
        margin: 0 auto;
      }
      .tab-container {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .tab-btn {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        background: #333;
        color: #aaa;
      }
      .tab-btn.active {
        background: #2ecc71;
        color: white;
      }
      .add-container {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      input[type='text'] {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #1e1e1e;
        color: white;
        font-size: 16px;
      }
      .add-btn {
        padding: 12px 20px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
        margin-top: 20px;
      }
      .item-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 8px;
        padding: 5px 10px;
        font-weight: bold;
      }
      .item-card.to-buy {
        background: #e74c3c;
        color: white;
      }
      .item-card.in-pantry {
        background: #2ecc71;
        color: white;
      }
      .toggle-area {
        flex: 1;
        text-align: left;
        padding: 10px 0;
        cursor: pointer;
        user-select: none;
      }
      .remove-btn {
        background: rgba(0, 0, 0, 0.2);
        border: none;
        color: white;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .footer-actions {
        margin-top: 30px;
      }
      .reset-btn {
        background: transparent;
        border: 1px solid #555;
        color: #888;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Family Lists Manager</h2>

    <!-- Tabs to switch active list -->
    <div class="tab-container">
      <button
        id="tab-groceries"
        class="tab-btn active"
        onclick="switchTab('groceries')"
      >
        🛒 Groceries
      </button>
      <button id="tab-hardware" class="tab-btn" onclick="switchTab('hardware')">
        🛠️ Hardware
      </button>
    </div>

    <!-- Add item container -->
    <div class="add-container">
      <input
        type="text"
        id="new-item-input"
        placeholder="Add item..."
        onkeydown="if (event.key === 'Enter') addItem();"
      />
      <button class="add-btn" onclick="addItem()">Add</button>
    </div>

    <div class="grid" id="button-container"></div>

    <div class="footer-actions">
      <button class="reset-btn" onclick="resetWebhook()">
        Reset Webhook URL
      </button>
    </div>

    <script>
      let WEBHOOK_URL = localStorage.getItem('discord_webhook');

      if (!WEBHOOK_URL || WEBHOOK_URL === 'null' || WEBHOOK_URL.trim() === '') {
        WEBHOOK_URL = prompt('Please enter your Discord Webhook URL:');
        if (WEBHOOK_URL) {
          localStorage.setItem('discord_webhook', WEBHOOK_URL.trim());
        }
      }

      const MESSAGE_ID = '1553444411508133930';
      let currentTab = 'groceries';

      // Multi-list structure saved in localStorage
      let lists = JSON.parse(localStorage.getItem('family_lists')) || {
        groceries: [
          { name: 'Milk', toBuy: true },
          { name: 'Eggs', toBuy: true },
          { name: 'Bread', toBuy: false },
        ],
        hardware: [
          { name: 'Screws (M4)', toBuy: true },
          { name: 'Tape', toBuy: false },
        ],
      };

      function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-groceries').className =
          `tab-btn ${tab === 'groceries' ? 'active' : ''}`;
        document.getElementById('tab-hardware').className =
          `tab-btn ${tab === 'hardware' ? 'active' : ''}`;
        renderButtons();
      }

      function saveAndRender() {
        localStorage.setItem('family_lists', JSON.stringify(lists));
        renderButtons();
      }

      function renderButtons() {
        const container = document.getElementById('button-container');
        container.innerHTML = '';
        const items = lists[currentTab];

        items.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = `item-card ${item.toBuy ? 'to-buy' : 'in-pantry'}`;

          const toggleArea = document.createElement('div');
          toggleArea.className = 'toggle-area';
          toggleArea.textContent = item.name;
          toggleArea.onclick = () => toggleItem(index);

          const removeBtn = document.createElement('button');
          removeBtn.className = 'remove-btn';
          removeBtn.innerHTML = '✕';
          removeBtn.onclick = (e) => {
            e.stopPropagation();
            removeItem(index);
          };

          card.appendChild(toggleArea);
          card.appendChild(removeBtn);
          container.appendChild(card);
        });
      }

      async function addItem() {
        const input = document.getElementById('new-item-input');
        const name = input.value.trim();
        if (!name) return;

        lists[currentTab].push({ name: name, toBuy: true });
        input.value = '';
        saveAndRender();
        await updateDiscord();
      }

      async function removeItem(index) {
        lists[currentTab].splice(index, 1);
        saveAndRender();
        await updateDiscord();
      }

      async function toggleItem(index) {
        lists[currentTab][index].toBuy = !lists[currentTab][index].toBuy;
        saveAndRender();
        await updateDiscord();
      }

      function formatList(items) {
        const toBuy =
          items
            .filter((i) => i.toBuy)
            .map((i) => `• ${i.name}`)
            .join('\n') || '*None*';
        const pantry =
          items
            .filter((i) => !i.toBuy)
            .map((i) => `• ${i.name}`)
            .join('\n') || '*None*';
        return { toBuy, pantry };
      }

      async function updateDiscord() {
        if (!WEBHOOK_URL) return;

        const g = formatList(lists.groceries);
        const h = formatList(lists.hardware);

        const payload = {
          content: '',
          embeds: [
            {
              title: '🛒 To Do List',
              color: 3447003,
              fields: [
                { name: '📌 To Buy', value: g.toBuy, inline: true },
                { name: '✅ In Pantry', value: g.pantry, inline: true },
              ],
            },
            {
              title: '🛠️ Already done List',
              color: 15105570,
              fields: [
                { name: '📌 Need', value: h.toBuy, inline: true },
                { name: '✅ Have', value: h.pantry, inline: true },
              ],
              timestamp: new Date().toISOString(),
            },
          ],
        };

        try {
          await fetch(`${WEBHOOK_URL}/messages/${MESSAGE_ID}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
        } catch (err) {
          console.error('Fetch Failed:', err);
        }
      }

      function resetWebhook() {
        localStorage.removeItem('discord_webhook');
        location.reload();
      }

      renderButtons();
      updateDiscord();
    </script>
  </body>
</html>
