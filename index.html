<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Grocery Manager!</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        text-align: center;
        background: #121212;
        color: white;
        max-width: 600px;
        margin: 0 auto;
      }
      .add-container {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      input[type='text'] {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #1e1e1e;
        color: white;
        font-size: 16px;
      }
      .add-btn {
        padding: 12px 20px;
        background: #3498db;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      .section-title {
        margin-top: 25px;
        font-size: 18px;
        text-align: left;
        border-bottom: 1px solid #333;
        padding-bottom: 5px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
        margin-top: 10px;
      }
      .item-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-radius: 8px;
        padding: 5px 10px;
        font-weight: bold;
      }
      .item-card.to-buy {
        background: #e74c3c;
        color: white;
      }
      .item-card.in-pantry {
        background: #2ecc71;
        color: white;
      }
      .item-card.master {
        background: #34495e;
        color: white;
      }
      .toggle-area {
        flex: 1;
        text-align: left;
        padding: 10px 0;
        cursor: pointer;
        user-select: none;
      }
      .remove-btn {
        background: rgba(0, 0, 0, 0.2);
        border: none;
        color: white;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .master-toggle-btn {
        margin: 20px 0;
        background: #9b59b6;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
      }
      .master-section {
        display: none;
        background: #1a1a1a;
        padding: 15px;
        border-radius: 8px;
        margin-top: 10px;
        border: 1px solid #333;
      }
      .master-section.open {
        display: block;
      }
      .footer-actions {
        margin-top: 30px;
      }
      .reset-btn {
        background: transparent;
        border: 1px solid #555;
        color: #888;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Shared Grocery Manager</h2>

    <div class="add-container">
      <input
        type="text"
        id="new-item-input"
        placeholder="Add to master list..."
        onkeydown="if (event.key === 'Enter') addToMaster();"
      />
      <button class="add-btn" onclick="addToMaster()">Add</button>
    </div>

    <div class="section-title">📌 TO DO (To Buy)</div>
    <div class="grid" id="to-buy-container">Fetching list from Discord...</div>

    <div class="section-title">✅ ALREADY DONE (In Pantry)</div>
    <div class="grid" id="pantry-container"></div>

    <button class="master-toggle-btn" onclick="toggleMasterSection()">
      📦 Toggle Master List (Background)
    </button>

    <div class="master-section" id="master-section">
      <div style="text-align: left; font-weight: bold; margin-bottom: 10px">
        Master List Items (Click to activate)
      </div>
      <div class="grid" id="master-container"></div>
    </div>

    <div class="footer-actions">
      <button class="reset-btn" onclick="resetWebhook()">
        Reset Webhook URL
      </button>
    </div>

    <script>
      let WEBHOOK_URL = localStorage.getItem('discord_webhook');

      if (!WEBHOOK_URL || WEBHOOK_URL === 'null' || WEBHOOK_URL.trim() === '') {
        WEBHOOK_URL = prompt('Please enter your Discord Webhook URL:');
        if (WEBHOOK_URL) {
          localStorage.setItem('discord_webhook', WEBHOOK_URL.trim());
        }
      }

      const MESSAGE_ID_ACTIVE = '1553444411508133930';
      const MESSAGE_ID_PANTRY = '1553448201078440050';
      const MESSAGE_ID_MASTER = 'PAigalda_Siia_Master_Sõnumi_ID'; // Asenda õige Discordi sõnumi ID-ga

      let items = []; // Sisaldab objekte: { name, status: 'tobuy' | 'pantry' | 'master' }

      async function fetchFromDiscord() {
        if (!WEBHOOK_URL) return;

        try {
          const [resActive, resPantry, resMaster] = await Promise.all([
            fetch(`${WEBHOOK_URL}/messages/${MESSAGE_ID_ACTIVE}`),
            fetch(`${WEBHOOK_URL}/messages/${MESSAGE_ID_PANTRY}`),
            fetch(`${WEBHOOK_URL}/messages/${MESSAGE_ID_MASTER}`),
          ]);

          const dataActive = await resActive.json();
          const dataPantry = await resPantry.json();
          const dataMaster = await resMaster.json();

          const activeText = dataActive.embeds?.[0]?.description || '';
          const pantryText = dataPantry.embeds?.[0]?.description || '';
          const masterText = dataMaster.embeds?.[0]?.description || '';

          const parseItems = (text) =>
            text
              .split('\n')
              .filter((line) => line.startsWith('• '))
              .map((line) => line.replace('• ', '').trim());

          const activeNames = parseItems(activeText);
          const pantryNames = parseItems(pantryText);
          const masterNames = parseItems(masterText);

          // Ehitame ühtse itemite массиvi, vältides duplikaate eelistusega: tobuy -> pantry -> master
          const itemMap = new Map();

          masterNames.forEach((name) => itemMap.set(name, 'master'));
          pantryNames.forEach((name) => itemMap.set(name, 'pantry'));
          activeNames.forEach((name) => itemMap.set(name, 'tobuy'));

          items = Array.from(itemMap.entries()).map(([name, status]) => ({
            name,
            status,
          }));

          renderUI();
        } catch (err) {
          console.error('Failed to fetch from Discord:', err);
          document.getElementById('to-buy-container').innerHTML =
            '<p style="color: #e74c3c;">Failed to load list from Discord.</p>';
        }
      }

      function renderUI() {
        const toBuyContainer = document.getElementById('to-buy-container');
        const pantryContainer = document.getElementById('pantry-container');
        const masterContainer = document.getElementById('master-container');

        toBuyContainer.innerHTML = '';
        pantryContainer.innerHTML = '';
        masterContainer.innerHTML = '';

        const toBuyItems = items.filter((i) => i.status === 'tobuy');
        const pantryItems = items.filter((i) => i.status === 'pantry');
        const masterItems = items.filter((i) => i.status === 'master');

        if (toBuyItems.length === 0) {
          toBuyContainer.innerHTML =
            '<p style="color: #888; font-size: 14px;">No items to buy.</p>';
        }
        if (pantryItems.length === 0) {
          pantryContainer.innerHTML =
            '<p style="color: #888; font-size: 14px;">No items in pantry.</p>';
        }
        if (masterItems.length === 0) {
          masterContainer.innerHTML =
            '<p style="color: #888; font-size: 14px;">Master list is empty.</p>';
        }

        items.forEach((item, index) => {
          const card = document.createElement('div');
          card.className = `item-card ${item.status === 'tobuy' ? 'to-buy' : item.status === 'pantry' ? 'in-pantry' : 'master'}`;

          const toggleArea = document.createElement('div');
          toggleArea.className = 'toggle-area';
          toggleArea.textContent = item.name;

          if (item.status === 'tobuy') {
            toggleArea.onclick = () => changeStatus(index, 'pantry');
          } else if (item.status === 'pantry') {
            toggleArea.onclick = () => changeStatus(index, 'tobuy');
          } else {
            toggleArea.onclick = () => changeStatus(index, 'tobuy'); // Masterist klikkides läheb to-buy nimekirja
          }

          const removeBtn = document.createElement('button');
          removeBtn.className = 'remove-btn';
          removeBtn.innerHTML = '✕';
          removeBtn.onclick = (e) => {
            e.stopPropagation();
            handleRemove(index);
          };

          card.appendChild(toggleArea);
          card.appendChild(removeBtn);

          if (item.status === 'tobuy') {
            toBuyContainer.appendChild(card);
          } else if (item.status === 'pantry') {
            pantryContainer.appendChild(card);
          } else {
            masterContainer.appendChild(card);
          }
        });
      }

      async function addToMaster() {
        const input = document.getElementById('new-item-input');
        const name = input.value.trim();
        if (!name) return;

        // Kontrollime kas juba eksisteerib
        const existing = items.find(
          (i) => i.name.toLowerCase() === name.toLowerCase(),
        );
        if (existing) {
          existing.status = 'tobuy'; // Kui eksisteerib, tõstame otse to-buy nimekirja
        } else {
          items.push({ name: name, status: 'tobuy' }); // Või lisame uue otse to-buy nimekirja
        }

        input.value = '';
        renderUI();
        await updateDiscord();
      }

      async function changeStatus(index, newStatus) {
        items[index].status = newStatus;
        renderUI();
        await updateDiscord();
      }

      async function handleRemove(index) {
        const item = items[index];
        if (item.status === 'pantry') {
          // Done/Pantry nimekirjast kustutades läheb tagasi master listi
          item.status = 'master';
        } else {
          // Muudest nimekirjadest kustutades eemaldatakse täielikult
          items.splice(index, 1);
        }
        renderUI();
        await updateDiscord();
      }

      function toggleMasterSection() {
        const section = document.getElementById('master-section');
        section.classList.toggle('open');
      }

      async function updateDiscord() {
        if (!WEBHOOK_URL) return;

        const activeText =
          items
            .filter((i) => i.status === 'tobuy')
            .map((i) => `• ${i.name}`)
            .join('\n') || '*None*';

        const pantryText =
          items
            .filter((i) => i.status === 'pantry')
            .map((i) => `• ${i.name}`)
            .join('\n') || '*None*';

        const masterText =
          items
            .filter((i) => i.status === 'master')
            .map((i) => `• ${i.name}`)
            .join('\n') || '*None*';

        const activePayload = {
          embeds: [
            {
              title: '📌 TO DO (To Buy)',
              color: 15158332,
              description: activeText,
              timestamp: new Date().toISOString(),
            },
          ],
        };

        const pantryPayload = {
          embeds: [
            {
              title: '✅ ALREADY DONE (In Pantry)',
              color: 3066993,
              description: pantryText,
              timestamp: new Date().toISOString(),
            },
          ],
        };

        const masterPayload = {
          embeds: [
            {
              title: '📦 MASTER LIST',
              color: 3447003,
              description: masterText,
              timestamp: new Date().toISOString(),
            },
          ],
        };

        try {
          await Promise.all([
            fetch(`${WEBHOOK_URL}/messages/${MESSAGE_ID_ACTIVE}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(activePayload),
            }),
            fetch(`${WEBHOOK_URL}/messages/${MESSAGE_ID_PANTRY}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(pantryPayload),
            }),
            fetch(`${WEBHOOK_URL}/messages/${MESSAGE_ID_MASTER}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(masterPayload),
            }),
          ]);
        } catch (err) {
          console.error('Failed to update Discord:', err);
        }
      }

      function resetWebhook() {
        localStorage.removeItem('discord_webhook');
        location.reload();
      }

      fetchFromDiscord();
    </script>
  </body>
</html>
